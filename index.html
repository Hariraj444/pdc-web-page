<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDC Web Page</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#0f172a;
            color:white;
        }

        header{
            height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            text-align:center;
        }

        header h1{
            font-size:60px;
            margin-bottom:20px;
        }

        header p{
            font-size:22px;
            margin-bottom:30px;
            color:#cbd5e1;
        }

        button{
            padding:15px 35px;
            border:none;
            border-radius:10px;
            background:#38bdf8;
            color:black;
            font-size:18px;
            cursor:pointer;
        }

        .cards{
            display:flex;
            justify-content:center;
            gap:30px;
            padding:80px 20px;
            flex-wrap:wrap;
        }

        .card{
            background:#1e293b;
            padding:30px;
            width:250px;
            border-radius:15px;
            text-align:center;
        }

    </style>

</head>

<body>

    <header>

        <h1>PDC WEB PAGE</h1>

        <p>Create modern websites using HTML & CSS</p>

        <button>Explore</button>

    </header>

    <section class="cards">

        <div class="card">
            <h2>HTML</h2>
            <p>Build webpage structure easily.</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>Design beautiful layouts.</p>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>Add interactions and animations.</p>
        </div>

    </section>

</body>
</html>
