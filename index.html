<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDC Web Page</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, sans-serif;
      background:#0f172a;
      color:white;
    }

    nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px 50px;
      background:#111827;
    }

    nav h2{
      color:#38bdf8;
    }

    nav ul{
      display:flex;
      gap:20px;
      list-style:none;
    }

    header{
      height:90vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px;
    }

    header h1{
      font-size:70px;
      margin-bottom:20px;
    }

    header p{
      font-size:22px;
      color:#cbd5e1;
      margin-bottom:30px;
      max-width:700px;
    }

    button{
      padding:15px 35px;
      border:none;
      border-radius:10px;
      background:#38bdf8;
      color:black;
      font-size:18px;
      cursor:pointer;
    }

    .cards{
      display:flex;
      justify-content:center;
      gap:30px;
      flex-wrap:wrap;
      padding:80px 20px;
    }

    .card{
      background:#1e293b;
      width:280px;
      padding:30px;
      border-radius:20px;
      text-align:center;
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-10px);
    }

    .card h2{
      margin-bottom:15px;
      color:#38bdf8;
    }

    footer{
      text-align:center;
      padding:30px;
      color:#94a3b8;
    }

  </style>
</head>

<body>

  <nav>
    <h2>PDC</h2>

    <ul>
      <li>Home</li>
      <li>About</li>
      <li>Projects</li>
      <li>Contact</li>
    </ul>
  </nav>

  <header>

    <h1>PDC WEB PAGE</h1>

    <p>
      Create modern and responsive websites using HTML, CSS and JavaScript.
    </p>

    <button>Explore</button>

  </header>

  <section class="cards">

    <div class="card">
      <h2>HTML</h2>
      <p>Create webpage structures easily.</p>
    </div>

    <div class="card">
      <h2>CSS</h2>
      <p>Design attractive responsive layouts.</p>
    </div>

    <div class="card">
      <h2>JavaScript</h2>
      <p>Add animations and interactivity.</p>
    </div>

  </section>

  <footer>
    © 2026 PDC Web Page
  </footer>

</body>
</html>
